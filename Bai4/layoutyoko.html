<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0 auto;
        }
        #container{
            border: 1px solid black;
            width: 900px;
            height: 800px;
        }
        #header1{
            width: 95%;
            height: 150px;
            border: 1px solid black;
            background-image: url(/Bai4/background.png);
        }
        #logo{
            width: 10%;
            height: 100px;
            float: left;
        }
        #menungang{
            width: 95%;
            height: 50px;
            border: 1px solid black;  
        }
        #menudoc1{
            width: 30%;
            height: 497px;
            border: 1px solid black; 
            float: left;  
        }
        #menudoc2{
            width: 40%;
            height: 497px;
            border: 1px solid black; 
            float: left;  
        }
        #menudoc3{
            width: 30%;
            height: 497px;
            border: 1px solid black; 
            float: right;  
        }
        #footer1{
            width: 100%;
            height: 100px;
            border-bottom: 1px solid black;
            clear: both;
            
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header1">
<div id="logo"><img src="/Bai4/logo.png"></div>

        </div>
        <div id="menungang"></div>
        <div id="menudoc1"></div>
        <div id="menudoc2"></div>
        <div id="menudoc3"></div>
        <div id="footer1"></div>
    </div>
</body>
</html>
