<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{box-sizing: border-box;
            margin: 0 ;}
            .container{
                border: 2px solid rgb(84, 127, 255);
                width: 600px;
                margin: auto;
                padding: 20px;
            }
            .center{
                text-align: center;
            }
            td,th{
    border: 0px solid black;
}
table{
    width: 100%;
}
    </style>
</head>
<body>
    <div class="container" >
<h1>Contact Us</h1>
<form>
    <fieldset>
    <legend>Your message:</legend>
<table>
    <tr>
        <td>To</td>
        <td><input type="text" name="" id=""></td>
    </tr>
    <tr>
        <td>Your email</td>
        <td><input type="text" name="" id=""></td>
    </tr>
    <tr>
        <td>Message</td>
        <td><textarea cols="45" rows="5"></textarea></td>
        
    </tr>
    <tr>
        <td>Attach File</td>
        <td><input type="file" name="" id=""></td>
        
    </tr>
</table>
</fieldset>
<fieldset>
<legend>How you found us:</legend>
    <tr>
        <td>How did you hear of us</td>
        <td>
            <select name="" id="">
                <option value="gle">Google</option>
                <option value="tikto">Tiktok</option>
                <option value="et">facebook</option>
            </select>
        </td>
    </tr>
    <tr>
        <td>Newsletter</td><br>
        <td><label><input type="checkbox" name="" id=""> Ensure this box is checked if you would like to receive email updates</label></td>
    </tr>
    <tr>
        <td>
            <input type="submit" value="Send message">
        </td>
    </tr>
</table>
</fieldset>











</form>







    </div>
</body>
</html>
