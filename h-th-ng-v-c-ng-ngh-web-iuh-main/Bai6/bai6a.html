<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{box-sizing: border-box;
            margin: 0 ;}
            .container{
                border: 2px solid black;
                width: 600px;
                margin: auto;
                padding: 20px;
                background-color: rgb(129, 182, 255);
            }
            .center{
                text-align: center;
            }
            td,th{
    border: 0px solid black;
}
table{
    width: 100%;
}
    </style>
</head>
<body>
    <div class="container">
<div class="center">
    <img src="/Bai6/tieude.jpg">
</div>

    <h1 class="center">Registration Form</h1>
<p class="center">
    Register your Jackson Electronics products here
</p>
<form action="#" method="post">
<table>
    <tr>
        <td align="right">First name:</td>
        <td><input type="text" name="" size="10"></td>
        <td>Last name</td>
        <td><input type="text" name="" size="10"></td>
    </tr>
    <tr>
        <td align="right">Address #1</td>
        <td colspan="3"><input type="text" name="" size="25"></td>
        
    </tr>
    <tr>
        <td>Address #2</td>
        <td colspan="3"><input type="text" name="" size="25"></td>
        
    </tr>
    <tr>
        <td>City</td>
        <td><input type="test" name="" id=""></td>
        <td align="right">State</td>
        <td><input type="text" name="" size="3"></td>
        <td>Zip</td>
        <td><input type="text" name="" size="5" ></td>
    </tr>
    <tr>
        <td>Coutry</td>
        <td><input type="text" name=""></td>
        
    </tr>
</table>
<hr color="black">
<table>
    <tr>
        <td align="right">Product</td>
        <td colspan="5"><input type="text" name="" size="10"></td>
        
    </tr>
    <tr>
        <td align="right">Date purchased</td>
        <td colspan="5"><input type="text" name="" ></td>
    </tr>
    <tr>
        <td align="right">Serial#</td>
        <td colspan="2"><input type="text" name="" id=""> </td>
        
    </tr>
    <tr>
        <td align="right" valign="top" >Used for:</td>
        <td>
            <label><input type="radio" name="usedfor" value="home">Home</label><br>
            <label><input type="radio" name="usedfor" value="home">Business</label><br>
            <label><input type="radio" name="usedfor" value="home">Government</label>
        </td>
        <td valign="top">
            <label><input type="radio" name="usedfor" id="">Educational Institution</label><br>
            <label><input type="radio" name="usedfor" id="">Other</label>
        </td>
        
    </tr>
    <tr>
        <td>system(check all that apply):</td>
        <td>
            <label><input type="checkbox" name="system" id="">Windows</label><br>
            <label><input type="checkbox" name="system" id="">Macnitosh</label>
        </td>
        <td>
            <label><input type="checkbox" name="system" id="">UNIX</label><br>
            <label><input type="checkbox" name="system" id="">Other</label>
        </td>
    </tr>
</table>
<hr color="black">
<table>
    <tr>
        <td>comment?</td>
        <td><textarea rows="5" cols="45"></textarea></td>
    </tr>
    <tr>
        
         <td colspan="6" align="center"><input type="submit" value="Click to Register">
         <input type="reset" value="Click to cancel"></td>
    </tr>
</table>

</form>
    </div>
</body>
</html>
