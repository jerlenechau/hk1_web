<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout1</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0 auto;
        }
        #container{
                width: 900px;
                height: 800px;
                border: 1px solid blue;
        }
        #header1{
            width: 100%;
            height: 200px;
            border-bottom: 1px solid black;
            text-align: center;
            line-height: 200px;
            text-transform: uppercase;
            font-size: 30px;
            color: brown;
            letter-spacing: 3px;
            font-style: italic;
            text-shadow: -5px -5px 5px orange ;
        }
        #menu1{
            width: 100%;
            height: 50px;
            border-bottom: 1px solid black;
        }
        #content1{
            width: 100%;
            height: 547px;
            border-bottom: 1px solid black;
            background-color: aqua;
        }
        #header1
    </style>
</head>
<body>
    <div id="container">
        <div id="header1">
            <h1>example cafe</h1>
            </div>
        <div id="menu1">menu</div>
        <div id="content1">content</div>

    </div>
</body>
</html>
