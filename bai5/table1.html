<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{
            border: 1px solid black;
        }
        *{
            box-sizing: border-box;
            margin: 0 auto
        }
        .container{
            border: 2px solid rgb(37, 37, 30);
            width: 500px;
            margin: auto;
            padding: 2px;
        }
        .text-center{text-align: center;}
    </style>
</head>
<body>
<div class="container">
    <div class="text-center"><p>Classic Movie Day</p> </div>
       
  <table>
        <tr>
            <th></th>
            <th>5 pm</th>
            <th>7 pm</th>
            <th>9 pm</th>
            <th>11 pm</th>
        </tr>
        <tr>
            <td class="text-center"><b>Screen<br>one</b></td>
            <td>Star War</td>
            <td>Empire Strikes <br>Back</td>
            <td>Return of the Jedi</td>
            <td>The Exorcist</td>
        </tr>
        <tr>
            <td class="text-center"><b>Screen<br>two</b></td>
            <td colspan="2">Dances with Wolves</td>
            <td colspan="2">Gone With the Wind</td>
        </tr>
         <tr>
            <td class="text-center"><b>Screen<br>three</b></td>
            <td colspan="2">2001: A Space Odyssey</td>
            <td>The Conversation</td>
            <td>5 Easy Pieces</td>
        </tr>
    </table>   
</div>
   
</body>
</html>
